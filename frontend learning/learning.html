        /* Scrollbars are always displayed */

<body>
    <h1>CSS Overflow Examples</h1>

    <div class="box overflow-visible">
        <h2>Overflow Visible</h2>
        <p>
            This content is longer than its container. Because overflow is
            visible, the extra content extends outside the container.
            This is the default overflow behavior.
        </p>
    </div>

    <div class="box overflow-hidden">
        <h2>Overflow Hidden</h2>
        <p>
            This content is longer than its container. The extra content
            will be clipped and hidden from the user.
        </p>
    </div>

    <div class="box overflow-scroll">
        <h2>Overflow Scroll</h2>
        <p>
            This content is longer than its container. Scrollbars are
            always displayed, even when they are not required.
        </p>
    </div>

    <div class="box overflow-auto">
        <h2>Overflow Auto</h2>
        <p>
            This content is longer than its container. Scrollbars appear
            automatically only when the content exceeds the available
            width or height of the container.
        </p>
    </div>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 1500px;
            padding: 40px;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
        }

        /* Floating button */

        .floating-button {
            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 100;

            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;

            color: #ffffff;
            background-color: #2563eb;
            font-size: 28px;
            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition:
                transform 0.3s ease,
                background-color 0.3s ease;
        }

        .floating-button:hover {
            transform: scale(1.1);
            background-color: #1d4ed8;
        }

        /* Modal background overlay */

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background-color: rgba(0, 0, 0, 0.6);
        }

        /* Displayed when JavaScript adds the class */

        .modal-overlay.active {
            display: flex;
        }

        /* Modal box */

        .modal {
            position: relative;
            width: min(500px, 100%);
            padding: 30px;
            border-radius: 12px;

            background-color: #ffffff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .modal h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        /* Close button */

        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;

            border: none;
            color: #4b5563;
            background: transparent;
            font-size: 30px;
            cursor: pointer;
        }

        .modal-action {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;

            color: #ffffff;
            background-color: #2563eb;
            cursor: pointer;
        }
    </style>
</head>
