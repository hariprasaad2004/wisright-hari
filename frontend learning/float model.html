<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Floating Button and Modal</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 1200px;
            padding: 40px;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
        }

        /* Floating plus button */

        .floating-plus {
            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;

            width: 65px;
            height: 65px;
            border-radius: 50%;

            color: #ffffff;
            background-color: #2563eb;

            font-size: 38px;
            font-weight: bold;
            line-height: 1;
            text-decoration: none;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.3s ease,
                background-color 0.3s ease;
        }

        .floating-plus:hover {
            color: #ffffff;
            background-color: #1d4ed8;
            text-decoration: none;
            transform: scale(1.1);
        }

        /* Modal background overlay */

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background-color: rgba(0, 0, 0, 0.65);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;
        }

        /* Display modal when its ID is targeted */

        .modal-overlay:target {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Modal content */

        .modal {
            position: relative;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 12px;

            color: #333333;
            background-color: #ffffff;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);

            transform: translateY(-30px);
            transition: transform 0.3s ease;
        }

        .modal-overlay:target .modal {
            transform: translateY(0);
        }

        .modal h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        /* Modal close button */

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;

            color: #374151;
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
            text-decoration: none;
        }

        .modal-close:hover {
            color: #dc2626;
        }

        /* Normal modal button */

        .modal-button {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 6px;

            color: #ffffff;
            background-color: #2563eb;
            text-decoration: none;
        }

        .modal-button:hover {
            color: #ffffff;
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>
    <main>
        <h1>Floating Button and Modal</h1>

        <p>
            The blue plus button is fixed in the bottom-right corner.
            Click it to open the modal.
        </p>
    </main>

    <!-- Floating plus button -->

    <a
        href="#contact-modal"
        class="floating-plus"
        aria-label="Open contact modal"
    >
        +
    </a>

    <!-- Modal -->

    <div class="modal-overlay" id="contact-modal">
        <section
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >
            <a
                href="#"
                class="modal-close"
                aria-label="Close modal"
            >
                &times;
            </a>

            <h2 id="modal-title">Contact Us</h2>

            <p>
                This modal is created using only HTML and CSS.
            </p>

            <a href="#" class="modal-button">
                Close Modal
            </a>
        </section>
    </div>
</body>
</html>
