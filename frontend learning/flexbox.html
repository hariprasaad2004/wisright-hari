<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexbox Example</title>

    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;

            min-height: 300px;
            padding: 20px;
            background-color: #f3f4f6;
        }

        .item {
            flex: 1 1 150px;

            max-width: 200px;
            padding: 30px;

            color: white;
            text-align: center;
            background-color: #2563eb;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
</body>
</html>
