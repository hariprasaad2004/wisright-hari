
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple and productive task management application.">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app-container">

    <header class="app-header">
      <div>
        <span class="eyebrow">STAY ORGANIZED</span>
        <h1>My To-Do List</h1>
        <p>Plan your day. Complete your goals.</p>
      </div>
      <div class="header-icon">✓</div>
    </header>

    <section class="stats-container" aria-label="Task statistics">
      <article class="stat-card">
        <span>Total Tasks</span>
        <strong id="total-count">0</strong>
      </article>
      <article class="stat-card">
        <span>Active</span>
        <strong id="active-count">0</strong>
      </article>
      <article class="stat-card">
        <span>Completed</span>
        <strong id="completed-count">0</strong>
      </article>
    </section>

    <section class="task-section">

      <h2>Add a New Task</h2>

      <form id="todo-form">
        <div class="input-group">
          <label for="todo-input">Task description</label>
          <input
            type="text"
            id="todo-input"
            placeholder="What do you need to do?"
            maxlength="150"
            required
          >
        </div>

        <div class="input-group">
          <label for="due-date">Due date (optional)</label>
          <input type="date" id="due-date">
        </div>

        <button type="submit" class="add-button">+ Add Task</button>
      </form>

      <p id="error-message" class="error-message" role="alert"></p>

      <div class="toolbar">
        <div class="filter-buttons" aria-label="Filter tasks">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="active">Active</button>
          <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <input
          type="search"
          id="search-input"
          placeholder="Search tasks..."
          aria-label="Search tasks"
        >
      </div>

      <div class="list-heading">
        <h2>Your Tasks</h2>
        <span id="task-count">0 tasks</span>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <div id="empty-message" class="empty-message">
        <div class="empty-icon">✦</div>
        <h3>No tasks found</h3>
        <p>Add a new task to get started!</p>
      </div>

    </section>

    <footer class="app-footer">
      <p>Stay focused. Keep moving forward.</p>
    </footer>

  </main>

</body>
</html>
