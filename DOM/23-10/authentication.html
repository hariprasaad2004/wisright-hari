
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Authentication Demo</title>
</head>
<body>

    <h2>Login Page</h2>

    <!-- User ID input -->
    <label for="userId">ID:</label>
    <input type="text" id="userId" placeholder="Enter your ID">

    <br><br>

    <!-- Password input -->
    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter password">

    <br><br>

    <button id="loginBtn">Login</button>
    <button id="profileBtn" hidden>Get Profile</button>
    <button id="logoutBtn" hidden>Logout</button>

    <!-- Result display panna -->
    <p id="message"></p>
    <p id="profile"></p>

    <script>
        

const userId = document.getElementById("userId");
const password = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");
const profileBtn = document.getElementById("profileBtn");
const logoutBtn = document.getElementById("logoutBtn");

const message = document.getElementById("message");
const profile = document.getElementById("profile");

const correctId = "hari";
const correctPassword = "12345";

// 1. Login function
loginBtn.addEventListener("click", function () {
    console.log("STATUS 1: Login function started");

    console.log("STATUS 2: Checking credentials");

    if (
        userId.value === correctId &&
        password.value === correctPassword
    ) {
        console.log("STATUS 3: Credentials are valid");

        // Demo token create pannuvom
        const token = "demo_token_" + Date.now();
        console.log("STATUS 4: Token generated");

        // Token save pannuvom
        sessionStorage.setItem("token", token);
        console.log("STATUS 5: Token stored in sessionStorage");

        message.textContent = "Login successful!";
        profile.textContent = "";

        profileBtn.hidden = false;
        logoutBtn.hidden = false;
        loginBtn.hidden = true;

        userId.disabled = true;
        password.disabled = true;

        console.log("STATUS 6: Login completed successfully");
    } else {
        console.log("STATUS ERROR: Invalid ID or Password");

        message.textContent = "Invalid ID or Password!";
        profile.textContent = "";
    }
});

// 2. Profile function
profileBtn.addEventListener("click", function () {
    console.log("STATUS 7: Profile function started");

    const token = sessionStorage.getItem("token");
    console.log("STATUS 8: Checking stored token");

    if (token) {
        console.log("STATUS 9: Token found");

        profile.textContent = "Welcome, Hari! Profile accessed.";
        console.log("STATUS 10: Profile accessed successfully");
    } else {
        console.log("STATUS ERROR: Token not found");

        profile.textContent = "Please login again.";
    }
});

// 3. Logout function
logoutBtn.addEventListener("click", function () {
    console.log("STATUS 11: Logout function started");

    sessionStorage.removeItem("token");
    console.log("STATUS 12: Token removed");

    message.textContent = "Logged out successfully!";
    profile.textContent = "";

    loginBtn.hidden = false;
    profileBtn.hidden = true;
    logoutBtn.hidden = true;

    userId.disabled = false;
    password.disabled = false;

    userId.value = "";
    password.value = "";

    console.log("STATUS 13: Logout completed successfully");
});

    </script>
</body>
</html>
