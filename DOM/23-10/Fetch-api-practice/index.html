<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
</head>
<body>

    <h1>Employee Management System</h1>

    <!-- GET: Employees list-ah fetch panna -->
    <button id="getBtn">Get Employees</button>

    <hr>

    <h2>Add Employee (POST)</h2>

    <form id="postForm">
        <input
            type="text"
            id="postName"
            placeholder="Employee name"
            required
        >

        <input
            type="email"
            id="postEmail"
            placeholder="Employee email"
            required
        >

        <button type="submit">Add Employee</button>
    </form>

    <hr>

    <h2>Replace Employee (PUT)</h2>

    <form id="putForm">
        <input
            type="number"
            id="putId"
            placeholder="Employee ID"
            min="1"
            required
        >

        <input
            type="text"
            id="putName"
            placeholder="New employee name"
            required
        >

        <input
            type="email"
            id="putEmail"
            placeholder="New employee email"
            required
        >

        <button type="submit">Replace Employee</button>
    </form>

    <hr>

    <h2>Update Employee (PATCH)</h2>

    <form id="patchForm">
        <input
            type="number"
            id="patchId"
            placeholder="Employee ID"
            min="1"
            required
        >

        <input
            type="text"
            id="patchName"
            placeholder="Updated name"
            required
        >

        <button type="submit">Update Employee</button>
    </form>

    <hr>

    <h2>Delete Employee (DELETE)</h2>

    <form id="deleteForm">
        <input
            type="number"
            id="deleteId"
            placeholder="Employee ID"
            min="1"
            required
        >

        <button type="submit">Delete Employee</button>
    </form>

    <hr>

    <h2>Employee List</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody id="employeeList">
            <!-- JavaScript moolama employee details inga display aagum -->
        </tbody>
    </table>

    <h2>API Response</h2>

    <pre id="output">API response inga display aagum...</pre>

    <!-- Separate JavaScript file-ah connect panrom -->
    <script src="script.js"></script>

</body>
</html>
